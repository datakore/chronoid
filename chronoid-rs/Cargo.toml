[package]
name = "datakore-chronoid"
version = "0.1.2"
edition = "2024"
description = "High-performance, distributed 64-bit Snowflake ID generator with millisecond-precision."
license = "MIT"
homepage = "https://github.com/datakore/chronoid"
repository = "https://github.com/datakore/chronoid"

[dependencies]
chrono = "0.4"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base62 = "2.0"
